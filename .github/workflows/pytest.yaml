name: Pytest

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: latest
            requirements: requirements_test.txt
          - name: ha-2026.7
            requirements: requirements_test_min.txt
    name: pytest (${{ matrix.name }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_test_min.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}

      - name: Show resolved HA / openai
        run: |
          python -c "import homeassistant as ha, openai, importlib.metadata as m; print('homeassistant', getattr(ha, '__version__', m.version('homeassistant'))); print('openai', openai.__version__); import homeassistant.helpers.llm as llm; print('ToolResult', getattr(llm, 'ToolResult', None))"

      - name: Run pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ -v --asyncio-mode=auto --timeout=60
